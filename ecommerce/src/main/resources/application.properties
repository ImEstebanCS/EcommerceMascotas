spring.application.name=ecommerce

# --- Base de datos H2 (en memoria) ---
spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# data.sql se carga despues de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Consola web de H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:ecommercedb) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger: http://localhost:8080/swagger-ui.html ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
